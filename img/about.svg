<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Entrada principal do salão Vasa Aurora">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e7d4"/>
      <stop offset="1" stop-color="#e2d3b6"/>
    </linearGradient>
    <linearGradient id="doorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a38"/>
      <stop offset="1" stop-color="#162e21"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a3d"/>
      <stop offset="1" stop-color="#d6ab5e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="460" fill="url(#bgG)"/>
  <rect x="0" y="330" width="640" height="130" fill="#c9b28b"/>

  <!-- pillars -->
  <rect x="40" y="60" width="44" height="300" rx="10" fill="url(#doorG)"/>
  <rect x="556" y="60" width="44" height="300" rx="10" fill="url(#doorG)"/>
  <rect x="40" y="60" width="44" height="14" rx="7" fill="#3a5c46"/>
  <rect x="556" y="60" width="44" height="14" rx="7" fill="#3a5c46"/>

  <!-- entablature -->
  <rect x="20" y="36" width="600" height="26" rx="6" fill="url(#doorG)"/>

  <!-- gold lettering -->
  <text x="320" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" letter-spacing="6" fill="url(#goldG)">VASA AURORA</text>

  <!-- double doors -->
  <rect x="150" y="120" width="170" height="230" rx="10" fill="url(#doorG)"/>
  <rect x="320" y="120" width="170" height="230" rx="10" fill="url(#doorG)"/>
  <rect x="98" y="168" width="52" height="182" rx="8" fill="#27432f"/>
  <rect x="490" y="168" width="52" height="182" rx="8" fill="#27432f"/>

  <!-- door gold lines + handles -->
  <line x1="195" y1="130" x2="195" y2="340" stroke="url(#goldG)" stroke-width="3"/>
  <line x1="445" y1="130" x2="445" y2="340" stroke="url(#goldG)" stroke-width="3"/>
  <circle cx="310" cy="240" r="6" fill="#d6ab5e"/>
  <circle cx="330" cy="240" r="6" fill="#d6ab5e"/>

  <!-- arched fanlight -->
  <path d="M150 120 a170 60 0 0 1 170 0 v10 h-170 z" fill="#3a8750"/>
  <path d="M150 120 a170 60 0 0 1 34 -20 M184 108 a140 50 0 0 1 -44 30 M300 84 v-2" stroke="#162e21" stroke-width="2" fill="none" opacity="0.5"/>
  <line x1="225" y1="118" x2="225" y2="72" stroke="url(#goldG)" stroke-width="2"/>

  <!-- doormat -->
  <rect x="260" y="350" width="120" height="16" rx="6" fill="#8a5a33"/>

  <!-- plants -->
  <ellipse cx="130" cy="338" rx="34" ry="14" fill="#8f6b3f"/>
  <path d="M120 340 Q112 300 132 286 Q148 282 146 340 Z" fill="#2e5e40"/>
  <path d="M140 340 Q150 304 144 286 Q166 276 158 340 Z" fill="#3a7a50"/>
  <ellipse cx="510" cy="338" rx="34" ry="14" fill="#8f6b3f"/>
  <path d="M498 340 Q490 300 508 288 Q528 282 520 340 Z" fill="#2e5e40"/>
  <path d="M518 340 Q528 306 522 288 Q542 276 536 340 Z" fill="#3a7a50"/>

  <!-- floor shine -->
  <path d="M180 360 L320 430 L320 460 L180 460 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M320 430 L460 360 L460 460 L320 460 Z" fill="#ffffff" opacity="0.12"/>

  <!-- welcome wreath -->
  <circle cx="320" cy="330" r="22" fill="none" stroke="#3a7a50" stroke-width="8"/>
  <circle cx="320" cy="330" r="14" fill="none" stroke="#2e5e40" stroke-width="5"/>
  <path d="M308 316 q6 6 12 0 M308 344 q6 -6 12 0" stroke="#d6ab5e" stroke-width="3" fill="none"/>
  <circle cx="320" cy="312" r="5" fill="#d6ab5e"/>
</svg>