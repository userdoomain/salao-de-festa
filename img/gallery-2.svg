<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" role="img" aria-label="Mesa decorada para jantar">
  <defs>
    <linearGradient id="tblG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5eee0"/>
      <stop offset="1" stop-color="#e7dcc4"/>
    </linearGradient>
    <radialGradient id="candleG" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="1" stop-color="#e8a86a" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <rect width="640" height="426" fill="#22364a"/>
  <rect x="0" y="240" width="640" height="140" fill="#1a2b3c"/>

  <!-- tablecloth -->
  <rect x="40" y="270" width="560" height="120" rx="20" fill="url(#tblG)"/>
  <path d="M40 350 q70 -70 140 0 q70 70 140 0 q70 -70 140 0 q70 70 140 0" fill="none" stroke="#cbbd9d" stroke-width="6"/>

  <!-- table runner -->
  <rect x="180" y="290" width="280" height="24" rx="12" fill="#b3402e"/>

  <!-- centerpiece with flowers -->
  <g>
    <path d="M320 300 l8 -34 M320 300 l-30 -18 M320 300 l30 -18" stroke="#3a7a50" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="320" cy="258" r="12" fill="#e35d4f"/>
    <circle cx="290" cy="280" r="10" fill="#f2a65e"/>
    <circle cx="350" cy="280" r="10" fill="#f2a65e"/>
    <circle cx="322" cy="242" r="8" fill="#f7d9a0"/>
    <circle cx="306" cy="270" r="9" fill="#e35d4f"/>
    <circle cx="338" cy="268" r="9" fill="#e35d4f"/>
    <rect x="312" y="298" width="16" height="34" rx="8" fill="#c9b98f"/>
  </g>

  <!-- candles -->
  <g>
    <rect x="120" y="296" width="10" height="34" rx="4" fill="#e9dfc8"/>
    <ellipse cx="125" cy="296" rx="5" ry="6" fill="url(#candleG)"/>
    <rect x="510" y="296" width="10" height="34" rx="4" fill="#e9dfc8"/>
    <ellipse cx="515" cy="296" rx="5" ry="6" fill="url(#candleG)"/>
  </g>

  <!-- plates -->
  <ellipse cx="170" cy="308" rx="34" ry="10" fill="#ffffff" opacity="0.92"/>
  <ellipse cx="170" cy="308" rx="26" ry="8" fill="none" stroke="#b98a3d" stroke-width="2"/>
  <ellipse cx="470" cy="308" rx="34" ry="10" fill="#ffffff" opacity="0.92"/>
  <ellipse cx="470" cy="308" rx="26" ry="8" fill="none" stroke="#b98a3d" stroke-width="2"/>

  <!-- wine glasses -->
  <path d="M410 300 l-6 18 M420 300 l-6 18 l0 0 M410 318 a4 4 0 0 0 8 0 Z M414 300 a6 5 0 0 0 12 0 Z" fill="none" stroke="#d8e4ea" stroke-width="2"/>
  <path d="M112 300 l-6 18 M122 300 l-6 18 M116 300 a6 5 0 0 0 12 0 Z M110 318 a4 4 0 0 0 10 0 Z" fill="none" stroke="#d8e4ea" stroke-width="2"/>

  <!-- sparkle -->
  <g fill="#ffe9b8" opacity="0.8">
    <circle cx="180" cy="252" r="4"/>
    <circle cx="420" cy="248" r="3"/>
    <circle cx="320" cy="196" r="5"/>
    <circle cx="240" cy="180" r="3"/>
    <circle cx="430" cy="190" r="3"/>
  </g>
  <path d="M320 190 l6 -12 M326 182 l-12 6 M326 182 l12 -2 M320 190 l-8 -8" stroke="#ffe9b8" stroke-width="2" fill="none"/>
</svg>