<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" role="img" aria-label="Espaço kids decorado com balões e brinquedos">
  <rect width="640" height="426" fill="#f2ead2"/>

  <!-- wall -->
  <rect x="0" y="0" width="640" height="300" fill="#f7f0de"/>
  <rect x="0" y="180" width="640" height="120" fill="#f0ead6"/>

  <!-- bunting -->
  <path d="M0 60 q80 40 160 0 q80 -40 160 0 q80 40 160 0 q80 -40 160 0" fill="none" stroke="#e0d2ae" stroke-width="2"/>
  <g>
    <polygon points="40,64 80,64 60,96" fill="#f2a65e"/>
    <polygon points="120,48 160,48 140,80" fill="#e8e0c8"/>
    <polygon points="200,64 240,64 220,96" fill="#e35d4f"/>
    <polygon points="280,48 320,48 300,80" fill="#58b2a0"/>
    <polygon points="360,64 400,64 380,96" fill="#f2a65e"/>
    <polygon points="440,48 480,48 460,80" fill="#e35d4f"/>
    <polygon points="520,64 560,64 540,96" fill="#58b2a0"/>
  </g>

  <!-- window -->
  <rect x="480" y="70" width="110" height="130" rx="8" fill="#bfe3ea" stroke="#d6ab5e" stroke-width="5"/>
  <line x1="535" y1="70" x2="535" y2="200" stroke="#d6ab5e" stroke-width="4"/>
  <line x1="480" y1="135" x2="590" y2="135" stroke="#d6ab5e" stroke-width="4"/>

  <!-- floor -->
  <rect x="0" y="300" width="640" height="126" fill="#d9b98a"/>

  <!-- play mat -->
  <rect x="80" y="330" width="260" height="90" rx="16" fill="#58b2a0"/>
  <rect x="300" y="330" width="260" height="90" rx="16" fill="#f2a65e"/>

  <!-- toy blocks -->
  <g stroke="#e8d9b8" stroke-width="3">
    <rect x="120" y="286" width="50" height="44" rx="6" fill="#e35d4f"/>
    <rect x="176" y="300" width="44" height="30" rx="6" fill="#f2a65e"/>
    <rect x="146" y="258" width="44" height="30" rx="6" fill="#58b2a0"/>
  </g>

  <!-- teddy bear -->
  <g>
    <circle cx="420" cy="330" r="34" fill="#c9a06c"/>
    <circle cx="384" cy="318" r="14" fill="#c9a06c"/>
    <circle cx="456" cy="318" r="14" fill="#c9a06c"/>
    <circle cx="420" cy="330" r="8" fill="#efe1c8"/>
    <circle cx="408" cy="326" r="3" fill="#232018"/>
    <circle cx="432" cy="326" r="3" fill="#232018"/>
    <path d="M412 342 a8 8 0 0 0 16 0" fill="#b3402e" stroke="#b3402e" stroke-width="2"/>
  </g>

  <!-- balloons -->
  <g>
    <path d="M120 210 q6 14 0 26" stroke="#e35d4f" stroke-width="3" fill="none"/>
    <ellipse cx="120" cy="176" rx="26" ry="34" fill="#e35d4f"/>
    <path d="M230 240 q6 14 0 26" stroke="#58b2a0" stroke-width="3" fill="none"/>
    <ellipse cx="230" cy="196" rx="26" ry="34" fill="#58b2a0"/>
    <path d="M56 260 q6 14 0 26" stroke="#f2a65e" stroke-width="3" fill="none"/>
    <ellipse cx="56" cy="216" rx="26" ry="34" fill="#f2a65e"/>
  </g>

  <!-- party hats -->
  <polygon points="300,150 330,150 315,104" fill="#e35d4f" stroke="#f2a65e" stroke-width="2"/>
  <circle cx="315" cy="101" r="5" fill="#f2a65e"/>
  <polygon points="352,160 380,160 366,118" fill="#58b2a0"/>
  <circle cx="366" cy="115" r="5" fill="#f7f0de"/>
</svg>