<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" role="img" aria-label="Mesa do bolo e brinde">
  <defs>
    <linearGradient id="w6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0de"/>
      <stop offset="1" stop-color="#eee3c9"/>
    </linearGradient>
    <linearGradient id="cakeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#f0e4c8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="426" fill="url(#w6)"/>
  <rect x="0" y="290" width="640" height="136" fill="#d9b98a"/>

  <!-- backdrop curtain -->
  <path d="M0 0 L640 0 L540 300 L100 300 Z" fill="#c26f51" opacity="0.9"/>
  <path d="M0 0 L640 0 L640 60 L0 60 Z" fill="#b3402e" opacity="0.55"/>
  <path d="M100 300 Q80 130 0 0" fill="none" stroke="#a3553c" stroke-width="3" opacity="0.6"/>
  <path d="M540 300 Q560 130 640 0" fill="none" stroke="#a3553c" stroke-width="3" opacity="0.6"/>

  <!-- wall panels -->
  <g stroke="#d6ab5e" stroke-opacity="0.6" stroke-width="3">
    <line x1="140" y1="64" x2="140" y2="290"/>
    <line x1="240" y1="64" x2="240" y2="290"/>
    <line x1="340" y1="64" x2="340" y2="290"/>
    <line x1="440" y1="64" x2="440" y2="290"/>
    <line x1="540" y1="64" x2="540" y2="290"/>
    <line x1="40" y1="290" x2="600" y2="290"/>
  </g>

  <!-- cake table -->
  <rect x="190" y="240" width="260" height="54" fill="#8a5a33"/>
  <rect x="190" y="236" width="260" height="10" rx="4" fill="#a06c3e"/>
  <g>
    <circle cx="236" cy="288" r="10" fill="#3a2a18"/>
    <circle cx="290" cy="294" r="10" fill="#3a2a18"/>
    <circle cx="350" cy="294" r="10" fill="#3a2a18"/>
    <circle cx="404" cy="288" r="10" fill="#3a2a18"/>
  </g>

  <!-- tiered cake -->
  <g>
    <ellipse cx="320" cy="224" rx="92" ry="14" fill="#fdf7ea"/>
    <rect x="228" y="206" width="184" height="18" rx="8" fill="url(#cakeG)"/>
    <ellipse cx="320" cy="188" rx="72" ry="12" fill="#fdf7ea"/>
    <rect x="248" y="188" width="144" height="36" rx="8" fill="url(#cakeG)"/>
    <ellipse cx="320" cy="158" rx="52" ry="10" fill="#fdf7ea"/>
    <rect x="268" y="158" width="104" height="30" rx="8" fill="url(#cakeG)"/>
    <ellipse cx="320" cy="136" rx="52" ry="10" fill="none" stroke="#d6ab5e" stroke-width="2"/>
    <rect x="286" y="104" width="18" height="44" rx="6" fill="#d6ab5e" opacity="0.9"/>
    <circle cx="295" cy="100" r="7" fill="#f2a65e"/>
    <circle cx="295" cy="100" r="3" fill="#fff6e0"/>
  </g>

  <!-- drips on cake -->
  <path d="M268 158 q10 16 20 0 q10 16 20 0 q10 16 20 0 q10 16 20 0 q10 16 20 0" fill="#e6d3aa"/>
  <path d="M248 188 q10 16 20 0 q10 16 20 0 q10 16 20 0 q10 16 20 0 q10 16 20 0 q10 16 20 0" fill="#e6d3aa"/>

  <!-- guests toasting -->
  <g>
    <circle cx="130" cy="300" r="17" fill="#e0b48a"/>
    <path d="M106 340 q24 -40 48 0" fill="#b3402e"/>
    <circle cx="510" cy="300" r="17" fill="#dba47e"/>
    <path d="M486 340 q24 -40 48 0" fill="#1f3d2c"/>
    <line x1="158" y1="312" x2="478" y2="312" stroke="#d6ab5e" stroke-width="4"/>
  </g>

  <!-- glasses -->
  <path d="M140 296 l-6 20 M140 296 a6 4 0 0 0 12 0 Z" fill="none" stroke="#cfe8ef" stroke-width="2.5"/>
  <path d="M500 296 l-6 20 M500 296 a6 4 0 0 0 12 0 Z" fill="none" stroke="#cfe8ef" stroke-width="2.5"/>

  <!-- confetti -->
  <g>
    <rect x="200" y="120" width="8" height="4" rx="2" fill="#f2a65e" transform="rotate(24 204 122)"/>
    <rect x="420" y="140" width="8" height="4" rx="2" fill="#58b2a0" transform="rotate(-18 424 142)"/>
    <rect x="340" y="90" width="8" height="4" rx="2" fill="#e35d4f" transform="rotate(40 344 92)"/>
    <rect x="500" y="100" width="8" height="4" rx="2" fill="#f2a65e" transform="rotate(-30 504 102)"/>
    <rect x="150" y="180" width="8" height="4" rx="2" fill="#58b2a0" transform="rotate(15 154 182)"/>
  </g>
</svg>